# 发布 GitHub Release 时：构建 Windows x64/ARM64 与 macOS ARM64 产物并上传到该 Release。
# 手动触发（Actions 页 Run workflow）：只构建并以 workflow artifacts 留存，不上传 Release。
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# 产物命名用的版本标识：Release 触发用 tag；手动触发用分支名（如 main）。
env:
  VERSION: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install
          bun install --cwd frontend

      # 便携 exe + NSIS 安装包（NetDream-setup-<版本>-<arch>.exe，
      # runner 未装 NSIS 时 mygo 会自动下载）。
      - name: Build ${{ matrix.arch }}
        run: bunx mygo build -platform windows/${{ matrix.arch }}

      - name: Stage artifacts
        shell: pwsh
        run: |
          $tag = "$env:VERSION"
          $dir = "build/windows-${{ matrix.arch }}"
          Copy-Item "$dir/NetDream.exe" "NetDream-$tag-windows-${{ matrix.arch }}.exe"
          Copy-Item "$dir/*setup*.exe" "NetDream-$tag-windows-${{ matrix.arch }}-setup.exe"
          Compress-Archive -Path "$dir/NetDream.exe", "$dir/icon.png" `
            -DestinationPath "NetDream-$tag-windows-${{ matrix.arch }}.zip"

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NetDream-*-windows-${{ matrix.arch }}.exe
            NetDream-*-windows-${{ matrix.arch }}-setup.exe
            NetDream-*-windows-${{ matrix.arch }}.zip

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NetDream-windows-${{ matrix.arch }}
          path: |
            NetDream-*-windows-${{ matrix.arch }}.exe
            NetDream-*-windows-${{ matrix.arch }}-setup.exe
            NetDream-*-windows-${{ matrix.arch }}.zip

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install
          bun install --cwd frontend

      # -sign -：ad-hoc 签名（无付费证书），首次打开需右键 → 打开。
      - name: Build darwin/arm64
        run: bunx mygo build -sign - -platform darwin/arm64

      - name: Stage artifacts
        run: |
          tag="$VERSION"
          app="$(ls -d build/darwin-arm64/*.app | head -n 1)"
          ditto -c -k --keepParent "$app" "NetDream-$tag-darwin-arm64.zip"

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/**/*.dmg
            NetDream-*-darwin-arm64.zip

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NetDream-darwin-arm64
          path: |
            build/**/*.dmg
            NetDream-*-darwin-arm64.zip
